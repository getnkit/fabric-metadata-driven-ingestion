<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1265" viewBox="0 0 1900 1265" role="img" aria-labelledby="d02-title d02-description">
<title id="d02-title">Environment Binding Architecture in Microsoft Fabric</title>
<desc id="d02-description">Git-tracked Fabric item definitions for the metadata-driven ingestion framework can be reused across DEV, UAT and PROD workspaces. DEV is implemented; UAT and PROD are design only. Three configuration areas require setup or verification per workspace: Variable Library runtime IDs, source/target resource bindings in SQL control metadata, and permissions/credentials. Same-workspace pipeline and notebook references support Git logical-ID dependency auto-binding.</desc>
