<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title-flow desc-flow">
<title id="title-flow">Microsoft Fabric pipeline orchestration</title>
<desc id="desc-flow">One master pipeline validates either explicit requests or active configurations from the Control SQL Database. Both paths reach the Dispatcher and the Object Controller, which routes each object to the SQL Server Database or SFTP File adapter.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#566272"/></marker><marker id="arrow-accent" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#B74A2A"/></marker></defs>
<rect width="1280" height="1160" fill="#F7F7F5"/>
<rect x="80" y="55" width="5" height="77" fill="#B74A2A"/>
<text x="108" y="77" fill="#737E8D" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5px">MICROSOFT FABRIC / PIPELINE ORCHESTRATION</text>
<text x="108" y="121" fill="#262B36" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="35" font-weight="650" text-anchor="start">One entry point. Shared execution.</text>
<text x="80" y="158" fill="#566272" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Every request reaches the same Dispatcher and Object Controller.</text>
