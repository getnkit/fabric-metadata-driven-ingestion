<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1084" viewBox="0 0 1440 1084" role="img" aria-labelledby="diag-title diag-desc">
<title id="diag-title">Microsoft Fabric metadata-driven batch ingestion architecture</title>
<desc id="diag-desc">Three planes. Fabric SQL Database stores ingestion configuration, logical connections, incremental watermarks, and terminal object audits. The Fabric Data Pipelines orchestrator selects active or explicit requests and dispatches them through a controller and DATABASE or FILE router. SQL Server tables use query-mode Copy directly to Bronze Delta. SFTP delimited-text files use Binary Copy to Lakehouse Files Landing and a Notebook for parsing and Delta append. Fabric Monitor shows execution, while Power BI summarizes recorded object audit. Both source paths support FULL and INCREMENTAL. Recovery detail is documented separately.</desc>
