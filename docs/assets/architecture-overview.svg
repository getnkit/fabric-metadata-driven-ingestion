<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1302" viewBox="0 0 1440 1302" role="img" aria-labelledby="diag-title diag-desc">
<title id="diag-title">Metadata-Driven Pipelines in Microsoft Fabric — architecture overview</title>
<desc id="diag-desc">Logical architecture split into Control and Audit Plane, Orchestration Plane, and Data Plane. Fabric SQL Database stores ingestion configuration, logical connections, incremental watermarks, and terminal object audit. The Orchestrator sends active scopes through Config Paginator to Dispatcher, while explicit run requests bypass pagination to the same Dispatcher. Object Controller looks up and validates configuration, then chooses DATABASE or FILE Router. The router selects SQL Server or SFTP FULL or INCREMENTAL adapter. SQL Server uses Query-mode Copy directly to Lakehouse Bronze Delta; SFTP uses Binary Copy to Landing in Lakehouse Files, then a Notebook parses delimited files and appends Bronze Delta. Operational checkpoints only advance after eligible successfully finalized regular incremental runs; successful Bronze ingestion appends batches while failed writes may require compensating cleanup. Fabric Monitor is for execution; SQL audit and Power BI record terminal object outcomes.</desc>
