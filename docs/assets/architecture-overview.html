<title id="fab-title">Microsoft Fabric metadata-driven batch ingestion architecture</title>
<desc id="fab-desc">The Fabric SQL control plane provides ingestion configuration and watermarks to the Data Factory orchestrator. It triggers SQL Server Query-mode Copy or SFTP Binary Copy, Landing, and a Notebook. Both paths append to Lakehouse Bronze. Object results are finalized in the SQL audit plane and summarized for operations in Power BI.</desc>
